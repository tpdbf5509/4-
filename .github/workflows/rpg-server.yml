# RPG 전용 서버(server/)를 Cloudflare 에 배포한다 — 작업 브랜치에 push 할 때마다.
# 저장소 비밀값: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID (D1 표는 server/schema.sql — 한 번 적용해 두었다)
name: rpg-server
on:
  push:
    branches: [claude/4-player-coop-defense-1x89l5]
    paths: ["server/**", "src/game/**", "src/net/version.js", ".github/workflows/rpg-server.yml"]
  workflow_dispatch:
concurrency: { group: rpg-server, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      # 비밀값을 붙여 넣을 때 딸려 온 줄바꿈 · 띄어쓰기를 지운다(남아 있으면 "invalid header value" 로 실패한다)
      - name: 비밀값 다듬기
        run: |
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="$(printf '%s' "${!k}" | tr -d '[:space:]')"
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포
        run: npx wrangler deploy
      - name: 배포 확인(health · 접속 · 장부)
        run: sleep 5 && node smoke.mjs
