# RPG 전용 서버(server/)를 Cloudflare 에 배포한다 — 작업 브랜치에 push 할 때마다.
# 저장소 비밀값: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · SUPABASE_SECRET_KEY
name: rpg-server
on:
  push:
    branches: [claude/4-player-coop-defense-1x89l5]
    paths: ["server/**", "src/game/**", "src/net/version.js", ".github/workflows/rpg-server.yml"]
  workflow_dispatch:
concurrency: { group: rpg-server, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 저장소 비밀 키 넣기
        run: printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
