# 테스트 서버(?test) 전용 워커 — 같은 코드를 광장 새 배치(src/game/plazaLayout.js)로 묶어 띄운다(11월 28일 광장 리뉴얼).
# 같은 워커 안의 방은 코드 상태를 함께 써서 RPGT 방만 다른 배치를 쓰게 할 수 없어 워커를 따로 둔다.
# 테스트 방(RPGT)과 배포 점검 방(CHECK)만 연다(index.js __TEST_WORKER__). 장부 · 방 중계는 본 워커(four-lane-rpg)의 것을 빌려 쓰고,
# 테스트 방은 장부를 읽기만 한다(room.js test). 배포는 GitHub Actions(rpg-server.yml)의 deploy-test.
name = "four-lane-rpg-test"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "RPG_ROOM"
class_name = "RpgRoom"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"
script_name = "four-lane-rpg"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"
script_name = "four-lane-rpg"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RpgRoom"]

[define]
__BUILD__ = "\"srv-test\""
__PLAZA_NEW__ = "true"
__TEST_WORKER__ = "true"
