# 네 갈래 방어선 서버 — RPG1~RPG4 방(Durable Object RpgRoom) · 장부(Ledger + D1) · 방 중계(Relay)
# Supabase 가 한도로 막혀 계정 · 저장 · 실시간을 모두 Cloudflare 로 옮겼다(2026-10-28).
# 배포는 GitHub Actions(.github/workflows/rpg-server.yml)가 push 때마다 한다.
name = "four-lane-rpg"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "RPG_ROOM"
class_name = "RpgRoom"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RpgRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ledger", "Relay"]

[[d1_databases]]
binding = "DB"
database_name = "four-lane"
database_id = "b11b5090-4df1-4d6d-816f-52d88a2db5b1"

[define]
__BUILD__ = "\"srv\""
