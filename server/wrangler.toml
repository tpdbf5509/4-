# 네 갈래 방어선 RPG 전용 서버 — RPG1~RPG5 가 저마다 Durable Object 하나(server/src/room.js)
# 배포는 GitHub Actions(.github/workflows/rpg-server.yml)가 push 때마다 한다.
# 비밀값(wrangler secret — GitHub Actions 가 넣는다): SUPABASE_SECRET_KEY. 주소는 아래 [vars]
name = "four-lane-rpg"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "RPG_ROOM"
class_name = "RpgRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RpgRoom"]

[define]
__BUILD__ = "\"srv\""

[vars]
SUPABASE_URL = "https://jgxtbtpxmnsfghqmtsnq.supabase.co"
